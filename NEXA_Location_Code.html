<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA Location Codes</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f3f4;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.box{width:100%;max-width:430px;background:#fff;padding:25px;border-radius:18px;box-shadow:0 5px 25px rgba(0,0,0,.12);text-align:center}
h1{margin:0 0 8px}
p{color:#666}
input{width:100%;padding:15px;font-size:18px;border:1px solid #ccc;border-radius:10px;margin:10px 0;text-align:center;text-transform:uppercase}
button{width:100%;padding:15px;border:0;border-radius:10px;background:#1a73e8;color:#fff;font-size:17px;font-weight:bold;cursor:pointer}
#result{margin-top:20px;padding:15px;background:#f5f5f5;border-radius:10px;display:none}
.examples{margin-top:20px;text-align:left;font-size:14px}
.examples div{padding:8px 0}
.small{font-size:12px;color:#888;margin-top:15px}
</style>
</head>
<body>
<div class="box">
  <h1>📍 NEXA Location</h1>
  <p>अपना NEXA Code डालें</p>

  <input id="code" type="text" placeholder="जैसे NEXA-001">

  <button onclick="openLocation()">🗺️ Open Location</button>

  <div id="result"></div>

  <div class="examples">
    <b>Demo Codes:</b>
    <div>📍 NEXA-001 → Taj Mahal, Agra</div>
    <div>📍 NEXA-002 → India Gate, New Delhi</div>
    <div>📍 NEXA-003 → Gateway of India, Mumbai</div>
  </div>

  <div class="small">NEXA Location Code Demo</div>
</div>

<script>
const locations = {
  "NEXA-001": {
    name: "Taj Mahal, Agra",
    lat: 27.1751,
    lon: 78.0421
  },
  "NEXA-002": {
    name: "India Gate, New Delhi",
    lat: 28.6129,
    lon: 77.2295
  },
  "NEXA-003": {
    name: "Gateway of India, Mumbai",
    lat: 18.9220,
    lon: 72.8347
  }
};

function openLocation() {
  const code = document.getElementById("code").value.trim().toUpperCase();
  const result = document.getElementById("result");

  if (!code) {
    result.style.display = "block";
    result.innerHTML = "⚠️ पहले NEXA Code डालें।";
    return;
  }

  const location = locations[code];

  if (!location) {
    result.style.display = "block";
    result.innerHTML = "❌ यह NEXA Code मौजूद नहीं है।";
    return;
  }

  result.style.display = "block";
  result.innerHTML = `
    📍 <b>${location.name}</b><br><br>
    Code: ${code}<br>
    Latitude: ${location.lat}<br>
    Longitude: ${location.lon}<br><br>
    🗺️ Google Maps खोला जा रहा है...
  `;

  const googleMapsURL =
    "https://www.google.com/maps/search/?api=1&query=" +
    location.lat + "," + location.lon;

  window.location.href = googleMapsURL;
}

document.getElementById("code").addEventListener("keydown", function(event) {
  if (event.key === "Enter") openLocation();
});
</script>
</body>
</html>
