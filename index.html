
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXA — Unlock Location</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #080b12;
  color: white;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 500px;
  margin: auto;
}

/* HEADER */

.header {
  text-align: center;
  margin-bottom: 25px;
}

.logo {
  font-size: 42px;
  font-weight: 900;
  letter-spacing: 2px;
}

.tagline {
  color: #aeb4c0;
  margin-top: 10px;
  font-size: 15px;
  line-height: 1.5;
}

/* SEARCH CARD */

.search-card {
  background: #111722;
  border: 1px solid #202938;
  border-radius: 22px;
  padding: 25px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.35);
}

.unlock-title {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 8px;
}

.unlock-subtitle {
  text-align: center;
  color: #9da5b3;
  font-size: 14px;
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 16px;
  border-radius: 12px;
  border: 1px solid #374151;
  background: #080b12;
  color: white;
  font-size: 18px;
  text-align: center;
  outline: none;
}

input:focus {
  border-color: #5b8cff;
}

.unlock-btn {
  width: 100%;
  margin-top: 12px;
  padding: 16px;
  border: none;
  border-radius: 12px;
  background: #356cff;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.unlock-btn:active {
  transform: scale(0.98);
}

/* RESULT */

#result {
  display: none;
  margin-top: 20px;
}

.location-card {
  background: #111722;
  border: 1px solid #202938;
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.35);
}

.location-image {
  width: 100%;
  height: 270px;
  object-fit: cover;
  display: block;
}

.location-info {
  padding: 20px;
}

.code-badge {
  display: inline-block;
  background: #1b2c55;
  color: #8fb0ff;
  padding: 7px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: bold;
}

.location-info h2 {
  margin: 12px 0;
  font-size: 25px;
}

.address {
  color: #b5bbc5;
  line-height: 1.5;
}

.fact {
  background: #0b1019;
  border-radius: 14px;
  padding: 16px;
  margin: 18px 0;
  color: #d5d9e0;
  line-height: 1.55;
}

.button {
  display: block;
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: none;
  border-radius: 12px;
  text-align: center;
  text-decoration: none;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.maps-button {
  background: #34a853;
  color: white;
}

.video-button {
  background: #ff0000;
  color: white;
}

.back-button {
  background: #252d3a;
  color: white;
}

/* ERROR */

.error {
  background: #251315;
  border: 1px solid #572326;
  border-radius: 14px;
  padding: 18px;
  text-align: center;
  color: #ff9b9b;
  line-height: 1.5;
}

/* FOOTER */

.footer {
  text-align: center;
  color: #697180;
  font-size: 13px;
  margin-top: 25px;
}

</style>
</head>

<body>

<div class="container">

  <!-- NEXA HEADER -->

  <div class="header">

    <div class="logo">
      NEXA 🌍
    </div>

    <div class="tagline">
      कुछ जगहें सिर्फ देखने के लिए नहीं…<br>
      खोजने के लिए होती हैं।
    </div>

  </div>


  <!-- CODE SEARCH -->

  <div class="search-card">

    <div class="unlock-title">
      🔐 Unlock a Location
    </div>

    <div class="unlock-subtitle">
      अपना NEXA Code डालकर location unlock करें
    </div>

    <input
      id="code"
      type="text"
      placeholder="NEXA-001"
      autocomplete="off"
      onkeydown="if(event.key === 'Enter') openLocation()"
    >

    <button
      class="unlock-btn"
      onclick="openLocation()"
    >
      🔓 UNLOCK LOCATION
    </button>

  </div>


  <!-- RESULT ONLY AFTER CODE -->
  <!-- NEXA CODE LAB BUTTON -->

  <button
    class="unlock-btn"
    onclick="openCodeLab()"
    style="margin-top:15px; background:#7c3aed;"
  >
    🧪 NEXA CODE LAB
  </button>
  <div id="result"></div>


  <div class="footer">
    NEXA © 2026
  </div>

</div>


<script>

/*
========================================
NEXA LOCATION DATA
========================================
*/

const locations = {


  "NEXA-001": {

    name: "Taj Mahal, Agra",

    address:
    "Dharmapuri, Forest Colony, Agra, Uttar Pradesh, India",

    fact:
    "ताजमहल मुगल सम्राट शाहजहाँ ने अपनी पत्नी मुमताज़ महल की याद में बनवाया था। यह भारत के सबसे प्रसिद्ध ऐतिहासिक स्मारकों में से एक है।",

    lat: 27.1751,

    lon: 78.0421,

    image:
    "https://commons.wikimedia.org/wiki/Special:Redirect/file/Taj-Mahal_CC0.jpg",

    video:
    ""

  },


  "NEXA-002": {

    name: "India Gate, New Delhi",

    address:
    "Kartavya Path, New Delhi, Delhi, India",

    fact:
    "India Gate नई दिल्ली में स्थित एक प्रसिद्ध युद्ध स्मारक है।",

    lat: 28.6129,

    lon: 77.2295,

    image:
    "",

    video:
    ""

  },


  "NEXA-003": {

    name: "Gateway of India, Mumbai",

    address:
    "Apollo Bandar, Colaba, Mumbai, Maharashtra, India",

    fact:
    "Gateway of India मुंबई के सबसे प्रसिद्ध ऐतिहासिक landmarks में से एक है।",

    lat: 18.9220,

    lon: 72.8347,

    image:
    "",

    video:
    ""

  },


  "NEXA-004": {

    name: "Eiffel Tower, Paris",

    address:
    "Champ de Mars, Paris, France",

    fact:
    "Eiffel Tower 1889 में Paris में आयोजित Exposition Universelle के लिए बनाया गया था और आज Paris की सबसे प्रसिद्ध पहचान में से एक है।",

    lat: 48.8584,

    lon: 2.2945,

    image:
    "",

    video:
    ""

  },


  "NEXA-005": {

    name: "Statue of Liberty, New York",

    address:
    "Liberty Island, New York, USA",

    fact:
    "Statue of Liberty New York Harbor में स्थित एक प्रसिद्ध monument है। इसे 1886 में officially dedicate किया गया था।",

    lat: 40.6892,

    lon: -74.0445,

    image:
    "",

    video:
    ""

  }

};


/*
========================================
OPEN LOCATION
========================================
*/
function openCodeLab() {

  const result = document.getElementById("result");

  result.style.display = "block";

  result.innerHTML = `
    <div class="location-card">

      <div class="location-info">

        <h2>🧪 NEXA Code Lab 2.0</h2>

        <p class="address">
          HTML + CSS + JavaScript लिखें और अपना project यहीं run करें।
        </p>

        <h3>HTML</h3>

        <textarea
          id="nexaHTML"
          style="
            width:100%;
            height:150px;
            padding:14px;
            border-radius:12px;
            border:1px solid #374151;
            background:#080b12;
            color:#fff;
            font-family:monospace;
            font-size:14px;
            resize:vertical;
          "
          placeholder="<h1>Hello NEXA 🚀</h1>"
        ></textarea>


        <h3>CSS</h3>

        <textarea
          id="nexaCSS"
          style="
            width:100%;
            height:130px;
            padding:14px;
            border-radius:12px;
            border:1px solid #374151;
            background:#080b12;
            color:#fff;
            font-family:monospace;
            font-size:14px;
            resize:vertical;
          "
          placeholder="h1 { color: blue; }"
        ></textarea>


        <h3>JavaScript</h3>

        <textarea
          id="nexaJS"
          style="
            width:100%;
            height:130px;
            padding:14px;
            border-radius:12px;
            border:1px solid #374151;
            background:#080b12;
            color:#fff;
            font-family:monospace;
            font-size:14px;
            resize:vertical;
          "
          placeholder="console.log('Hello NEXA');"
        ></textarea>


        <button
          class="button maps-button"
          onclick="runNexaCode()"
        >
          ▶️ RUN CODE
        </button>


        <button
          class="button back-button"
          onclick="clearNexaCode()"
        >
          🗑️ CLEAR
        </button>


        <div
          style="
            margin-top:20px;
            color:#9da5b3;
            font-weight:bold;
          "
        >
          OUTPUT / LIVE PREVIEW
        </div>


        <iframe
          id="nexaOutput"
          sandbox="allow-scripts"
          style="
            width:100%;
            height:350px;
            margin-top:10px;
            border:none;
            border-radius:12px;
            background:white;
          "
        ></iframe>


        <button
          class="button back-button"
          onclick="closeLocation()"
        >
          ← Back
        </button>

      </div>

    </div>
  `;
}


function runNexaCode() {

  const html =
    document.getElementById("nexaHTML").value;

  const css =
    document.getElementById("nexaCSS").value;

  const js =
    document.getElementById("nexaJS").value;


  const output =
    document.getElementById("nexaOutput");


  const finalCode = `

    <!DOCTYPE html>

    <html>

    <head>

      <meta charset="UTF-8">

      <style>

        ${css}

      </style>

    </head>

    <body>

      ${html}

      <script>

        ${js}

      <\/script>

    </body>

    </html>

  `;


  output.srcdoc = finalCode;
}


function clearNexaCode() {

  document.getElementById("nexaHTML").value = "";

  document.getElementById("nexaCSS").value = "";

  document.getElementById("nexaJS").value = "";

  document.getElementById("nexaOutput").srcdoc = "";

}



function clearNexaCode() {

  document.getElementById("nexaHTML").value = "";

  document.getElementById("nexaCSS").value = "";

  document.getElementById("nexaJS").value = "";

  document.getElementById("nexaOutput").srcdoc = "";

}

</script>

</body>
</html>
