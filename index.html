<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXA — Unlock The World</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #080b12;
  color: white;
  min-height: 100vh;
}

.container {
  width: 100%;
  max-width: 600px;
  margin: auto;
  padding: 25px 15px 40px;
}

/* HEADER */

.header {
  text-align: center;
  padding: 25px 10px 20px;
}

.logo {
  font-size: 42px;
  font-weight: 900;
  letter-spacing: 2px;
}

.tagline {
  color: #aeb4c0;
  margin-top: 8px;
  font-size: 15px;
}

/* SEARCH */

.search-card {
  background: #111722;
  border: 1px solid #202938;
  border-radius: 22px;
  padding: 22px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.35);
}

.unlock-title {
  text-align: center;
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 6px;
}

.unlock-subtitle {
  text-align: center;
  color: #9da5b3;
  font-size: 14px;
  margin-bottom: 18px;
}

input {
  width: 100%;
  padding: 16px;
  border-radius: 12px;
  border: 1px solid #374151;
  background: #080b12;
  color: white;
  font-size: 18px;
  text-align: center;
  outline: none;
}

input:focus {
  border-color: #5b8cff;
}

.unlock-btn {
  width: 100%;
  margin-top: 12px;
  padding: 16px;
  border: none;
  border-radius: 12px;
  background: #356cff;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.unlock-btn:active {
  transform: scale(0.98);
}

/* FEATURED */

.section-title {
  margin: 30px 0 12px;
  font-size: 20px;
}

.featured {
  background: #111722;
  border: 1px solid #202938;
  border-radius: 20px;
  overflow: hidden;
}

.featured-image {
  width: 100%;
  height: 240px;
  object-fit: cover;
  display: block;
}

.featured-info {
  padding: 18px;
}

.badge {
  display: inline-block;
  padding: 6px 10px;
  border-radius: 8px;
  background: #1b2c55;
  color: #8fb0ff;
  font-size: 12px;
  font-weight: bold;
}

.featured h2 {
  margin: 12px 0 8px;
}

.featured p {
  color: #b4bac5;
  line-height: 1.5;
}

/* RESULT */

#result {
  display: none;
  margin-top: 20px;
}

.location-card {
  background: #111722;
  border: 1px solid #202938;
  border-radius: 22px;
  overflow: hidden;
}

.location-image {
  width: 100%;
  height: 270px;
  object-fit: cover;
  display: block;
}

.location-info {
  padding: 20px;
}

.code-badge {
  display: inline-block;
  background: #1b2c55;
  color: #8fb0ff;
  padding: 7px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: bold;
}

.location-info h2 {
  margin: 12px 0;
  font-size: 25px;
}

.address {
  color: #b5bbc5;
  line-height: 1.5;
}

.fact {
  background: #0b1019;
  border-radius: 14px;
  padding: 16px;
  margin: 18px 0;
  color: #d5d9e0;
  line-height: 1.55;
}

.button {
  display: block;
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: none;
  border-radius: 12px;
  text-align: center;
  text-decoration: none;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.maps-button {
  background: #34a853;
  color: white;
}

.video-button {
  background: #ff0000;
  color: white;
}

.back-button {
  background: #252d3a;
  color: white;
}

/* ERROR */

.error {
  background: #251315;
  border: 1px solid #572326;
  border-radius: 14px;
  padding: 18px;
  text-align: center;
  color: #ff9b9b;
}

/* FOOTER */

.footer {
  text-align: center;
  color: #697180;
  font-size: 13px;
  margin-top: 35px;
}

</style>
</head>

<body>

<div class="container">

  <!-- HEADER -->

  <div class="header">

    <div class="logo">
      NEXA 🌍
    </div>

    <div class="tagline">
      कुछ जगहें सिर्फ देखने के लिए नहीं… खोजने के लिए होती हैं।
    </div>

  </div>


  <!-- CODE SEARCH -->

  <div class="search-card">

    <div class="unlock-title">
      🔐 Unlock a Location
    </div>

    <div class="unlock-subtitle">
      अपना NEXA Code डालकर जगह खोजें
    </div>

    <input
      id="code"
      type="text"
      placeholder="NEXA-001"
      autocomplete="off"
      onkeydown="if(event.key === 'Enter') openLocation()"
    >

    <button
      class="unlock-btn"
      onclick="openLocation()"
    >
      🔓 UNLOCK LOCATION
    </button>

  </div>


  <!-- FEATURED STORY -->

  <div class="section-title">
    ⭐ Featured NEXA
  </div>

  <div class="featured">

    <img
      class="featured-image"
      src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Taj-Mahal_CC0.jpg"
      alt="Taj Mahal"
    >

    <div class="featured-info">

      <span class="badge">
        NEXA-001
      </span>

      <h2>
        Taj Mahal, Agra
      </h2>

      <p>
        दुनिया की सबसे प्रसिद्ध ऐतिहासिक इमारतों में से एक।
        NEXA Code डालकर इसकी पूरी जानकारी explore करें।
      </p>

    </div>

  </div>


  <!-- RESULT -->

  <div id="result"></div>


  <!-- FOOTER -->

  <div class="footer">
    NEXA © 2026<br>
    Discover • Verify • Explore
  </div>

</div>


<script>


/*
========================================
NEXA LOCATION DATABASE
========================================
*/

const locations = {


  "NEXA-001": {

    name: "Taj Mahal, Agra",

    address:
    "Dharmapuri, Forest Colony, Agra, Uttar Pradesh, India",

    fact:
    "ताजमहल मुगल सम्राट शाहजहाँ ने अपनी पत्नी मुमताज़ महल की याद में बनवाया था। इसका निर्माण 17वीं शताब्दी में हुआ था और यह आज दुनिया के सबसे प्रसिद्ध स्मारकों में से एक है।",

    lat: 27.1751,

    lon: 78.0421,

    image:
    "https://commons.wikimedia.org/wiki/Special:Redirect/file/Taj-Mahal_CC0.jpg",

    video:
    ""

  },


  "NEXA-002": {

    name: "India Gate, New Delhi",

    address:
    "Kartavya Path, New Delhi, Delhi, India",

    fact:
    "India Gate नई दिल्ली में स्थित एक प्रसिद्ध युद्ध स्मारक है और शहर के सबसे पहचाने जाने वाले landmarks में से एक है।",

    lat: 28.6129,

    lon: 77.2295,

    image:
    "",

    video:
    ""

  },


  "NEXA-003": {

    name: "Gateway of India, Mumbai",

    address:
    "Apollo Bandar, Colaba, Mumbai, Maharashtra, India",

    fact:
    "Gateway of India मुंबई के Apollo Bunder क्षेत्र में स्थित एक प्रसिद्ध ऐतिहासिक monument है।",

    lat: 18.9220,

    lon: 72.8347,

    image:
    "",

    video:
    ""

  },


  "NEXA-004": {

    name: "Eiffel Tower, Paris",

    address:
    "Champ de Mars, Paris, France",

    fact:
    "Eiffel Tower 1889 में Paris में आयोजित Exposition Universelle के लिए बनाया गया था और आज Paris की सबसे प्रसिद्ध पहचान में से एक है।",

    lat: 48.8584,

    lon: 2.2945,

    image:
    "",

    video:
    ""

  },


  "NEXA-005": {

    name: "Statue of Liberty, New York",

    address:
    "Liberty Island, New York, USA",

    fact:
    "Statue of Liberty New York Harbor में स्थित एक प्रसिद्ध monument है। इसे 1886 में officially dedicate किया गया था।",

    lat: 40.6892,

    lon: -74.0445,

    image:
    "",

    video:
    ""

  }

};


/*
========================================
OPEN LOCATION
========================================
*/

function openLocation() {


  const code =
    document
    .getElementById("code")
    .value
    .trim()
    .toUpperCase();


  const result =
    document.getElementById("result");


  const location =
    locations[code];


  if (!code) {

    result.style.display = "block";

    result.innerHTML =
      '<div class="error">' +
      '⚠️ पहले NEXA Code डालें।' +
      '</div>';

    return;

  }


  if (!location) {

    result.style.display = "block";

    result.innerHTML =
      '<div class="error">' +
      '❌ यह NEXA Code मौजूद नहीं है।<br><br>' +
      'Code दोबारा check करें।' +
      '</div>';

    return;

  }


  /*
  GOOGLE MAPS
  */

  const mapsURL =
    "https://www.google.com/maps/search/?api=1&query=" +
    location.lat +
    "," +
    location.lon;


  /*
  PHOTO
  */

  let photo = "";


  if (location.image) {

    photo =
      '<img class="location-image" src="' +
      location.image +
      '" alt="' +
      location.name +
      '">';

  }


  /*
  VIDEO BUTTON
  */

  let videoButton = "";


  if (location.video) {

    videoButton =
      '<a class="button video-button" href="' +
      location.video +
      '" target="_blank">' +
      '▶️ Watch NEXA Video' +
      '</a>';

  }


  /*
  RESULT
  */

  result.style.display = "block";


  result.innerHTML =

    '<div class="location-card">' +

      photo +

      '<div class="location-info">' +

        '<span class="code-badge">' +
        code +
        '</span>' +

        '<h2>📍 ' +
        location.name +
        '</h2>' +

        '<div class="address">' +
        '📌 <b>Address</b><br>' +
        location.address +
        '</div>' +

        '<div class="fact">' +
        '🧠 <b>Interesting Fact</b><br><br>' +
        location.fact +
        '</div>' +

        videoButton +

        '<a class="button maps-button" href="' +
        mapsURL +
        '" target="_blank">' +
        '🗺️ Open in Google Maps' +
        '</a>' +

        '<button class="button back-button" onclick="closeLocation()">' +
        '← Back' +
        '</button>' +

      '</div>' +

    '</div>';

}


/*
========================================
CLOSE LOCATION
========================================
*/

function closeLocation() {

  const result =
    document.getElementById("result");

  result.style.display = "none";

  result.innerHTML = "";

}


/*
========================================
AUTO UPPERCASE
========================================
*/

document
.getElementById("code")
.addEventListener("input", function() {

  this.value =
    this.value.toUpperCase();

});

</script>

</body>
</html>
