<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ataoullah | NEXA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #050505, #111827);
      color: white;
      display: flex;
      justify-content: center;
      padding: 25px 15px;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
    }

    .box {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }

    h2 {
      margin-top: 0;
    }

    textarea,
    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #555;
      background: #111;
      color: white;
      font-size: 16px;
      margin-bottom: 12px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #ffffff;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:active {
      transform: scale(0.98);
    }

    .result {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #050505;
      word-break: break-all;
      display: none;
    }

    .error {
      color: #ff6b6b;
    }

    .success {
      color: #7CFF9B;
    }

    .message-view {
      font-size: 20px;
      line-height: 1.6;
      background: #050505;
      padding: 20px;
      border-radius: 12px;
      margin-top: 15px;
    }

    .small {
      color: #999;
      font-size: 13px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🌐 Ataoullah</h1>
    <div class="subtitle">NEXA • One-Time Message</div>


    <!-- ========================= -->
    <!-- ONE TIME MESSAGE -->
    <!-- ========================= -->

    <div class="box" id="oneTimeBox">

      <h2>🔐 One-Time Message</h2>

      <p>
        ऐसा message बनाओ जिसे link खोलने के बाद
        एक बार देखने पर दोबारा नहीं देखा जा सके।
      </p>

      <textarea
        id="messageInput"
        rows="5"
        placeholder="अपना secret message यहाँ लिखें..."
      ></textarea>

      <button onclick="createMessage()">
        🔗 One-Time Link बनाओ
      </button>

      <div id="linkResult" class="result"></div>

    </div>


    <!-- ========================= -->
    <!-- VIEW ONE TIME MESSAGE -->
    <!-- ========================= -->

    <div class="box" id="viewBox" style="display:none;">

      <h2>📩 One-Time Message</h2>

      <div id="messageView" class="message-view">
        Message loading...
      </div>

    </div>


    <!-- ========================= -->
    <!-- NEXA LOCATION -->
    <!-- ========================= -->

    <div class="box" id="locationBox">

      <h2>🌍 NEXA Location</h2>

      <p>
        अपना NEXA access code डालें।
      </p>

      <input
        type="text"
        id="nexaCode"
        placeholder="Enter NEXA Code"
      >

      <button onclick="unlockNexa()">
        🔓 Unlock NEXA
      </button>

      <div id="nexaResult" class="result"></div>

    </div>

  </div>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    /* =====================================
       SUPABASE SETTINGS
       ===================================== */

    const SUPABASE_URL =
      "https://crtoxfnqfyhorcxypxem.supabase.co";

    /*
      भाई 👇 यहाँ अपनी Supabase
      Publishable Key डालना।
    */

    const SUPABASE_KEY =
      sb_publishable_8q9uqlafK4f6BctsrRLnjg_0PG3K5lu


    const db = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    /* =====================================
       ONE TIME MESSAGE CREATE
       ===================================== */

    async function createMessage() {

      const input =
        document.getElementById("messageInput");

      const result =
        document.getElementById("linkResult");

      const message =
        input.value.trim();


      result.style.display = "block";
      result.className = "result";


      if (!message) {

        result.innerHTML =
          '<span class="error">❌ पहले message लिखो।</span>';

        return;
      }


      result.innerHTML =
        "⏳ Link बनाया जा रहा है...";


      try {

        /*
          Random token
        */

        const randomBytes =
          new Uint8Array(24);

        crypto.getRandomValues(randomBytes);


        const token =
          Array.from(randomBytes)
            .map(
              b => b.toString(16).padStart(2, "0")
            )
            .join("");


        /*
          IMPORTANT:
          तुम्हारी असली table का नाम
          Messages One Table है।
        */

        const { data, error } =
          await db
            .from("Messages One Table")
            .insert([
              {
                Message: message,
                Token: token,
                Viewed: false
              }
            ])
            .select();


        if (error) {

          console.error(error);

          result.innerHTML =
            '<span class="error">' +
            "❌ Supabase Error:<br>" +
            error.message +
            "</span>";

          return;
        }


        /*
          Link बनाना
        */

        const link =
          window.location.origin +
          window.location.pathname +
          "?token=" +
          token;


        result.innerHTML = `
          <div class="success">
            ✅ One-Time Link तैयार है!
          </div>

          <br>

          <input
            id="generatedLink"
            value="${link}"
            readonly
          >

          <button onclick="copyLink()">
            📋 Link Copy करो
          </button>
        `;


        input.value = "";

      }

      catch (error) {

        console.error(error);

        result.innerHTML =
          '<span class="error">' +
          "❌ Error: " +
          error.message +
          "</span>";
      }

    }


    /* =====================================
       COPY LINK
       ===================================== */

    function copyLink() {

      const link =
        document.getElementById("generatedLink");

      link.select();

      navigator.clipboard
        .writeText(link.value)
        .then(() => {

          alert("✅ Link Copy हो गया!");

        })
        .catch(() => {

          alert("Link को manually copy कर लो।");

        });

    }


    /* =====================================
       OPEN ONE TIME MESSAGE
       ===================================== */

    async function openOneTimeMessage() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const token =
        params.get("token");


      if (!token) {
        return;
      }


      document.getElementById(
        "oneTimeBox"
      ).style.display = "none";


      document.getElementById(
        "locationBox"
      ).style.display = "none";


      document.getElementById(
        "viewBox"
      ).style.display = "block";


      const messageView =
        document.getElementById(
          "messageView"
        );


      messageView.innerHTML =
        "⏳ Message खुल रहा है...";


      try {

        const { data, error } =
          await db
            .from("Messages One Table")
            .select("id,Message,Viewed")
            .eq("Token", token)
            .eq("Viewed", false)
            .maybeSingle();


        if (error) {

          console.error(error);

          messageView.innerHTML =
            '<span class="error">' +
            "❌ Error: " +
            error.message +
            "</span>";

          return;
        }


        if (!data) {

          messageView.innerHTML =
            '<span class="error">' +
            "❌ यह message पहले ही देखा जा चुका है या मौजूद नहीं है।" +
            "</span>";

          return;
        }


        /*
          पहले message दिखाओ
        */

        messageView.innerText =
          data.Message;


        /*
          फिर Viewed = true
        */

        const { error: updateError } =
          await db
            .from("Messages One Table")
            .update({
              Viewed: true
            })
            .eq("id", data.id);


        if (updateError) {

          console.error(updateError);

        }

      }

      catch (error) {

        console.error(error);

        messageView.innerHTML =
          '<span class="error">' +
          "❌ Error: " +
          error.message +
          "</span>";

      }

    }


    /* =====================================
       NEXA LOCATION
       ===================================== */

    function unlockNexa() {

      const code =
        document.getElementById(
          "nexaCode"
        ).value.trim();


      const result =
        document.getElementById(
          "nexaResult"
        );


      result.style.display = "block";
      result.className = "result";


      /*
        पुराना NEXA CODE
      */

      if (code === "NEXA583") {

        result.innerHTML = `
          <div class="success">
            <h3>🌍 NEXA Unlocked</h3>

            <p>
              📍 Bengaluru, Karnataka
            </p>

            <p>
              NEXA Location system active.
            </p>
          </div>
        `;

      }

      else {

        result.innerHTML =
          '<span class="error">' +
          "❌ गलत NEXA Code" +
          "</span>";

      }

    }


    /* =====================================
       START
       ===================================== */

    openOneTimeMessage();

  </script>

</body>
</html>
