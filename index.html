<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXA 🌍</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:#05070d;
  color:white;
  padding:20px 14px;
}

.container{
  width:100%;
  max-width:600px;
  margin:auto;
}

/* NEXA HEADER */
.header{
  text-align:center;
  padding:25px 10px 20px;
}

.logo{
  font-size:42px;
  font-weight:bold;
  letter-spacing:2px;
}

.tagline{
  color:#aaa;
  margin-top:8px;
  font-size:14px;
}

.quote{
  text-align:center;
  color:#b8c0d0;
  font-size:14px;
  margin:5px 0 25px;
  line-height:1.6;
}

/* BOX */
.box{
  background:#0d111c;
  border:1px solid #293247;
  border-radius:18px;
  padding:20px;
  margin-bottom:20px;
}

h2{
  margin-top:0;
}

p{
  color:#c4c9d4;
  line-height:1.6;
}

/* INPUT */
textarea,
input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #39445a;
  background:#05070d;
  color:white;
  font-size:16px;
  margin-bottom:12px;
  outline:none;
}

textarea{
  resize:vertical;
}

/* BUTTON */
button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:white;
  color:#05070d;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.result{
  margin-top:15px;
  padding:13px;
  border-radius:10px;
  background:#05070d;
  word-break:break-word;
  display:none;
}

.success{
  color:#7CFF9B;
}

.error{
  color:#ff6b6b;
}

.message-view{
  font-size:20px;
  line-height:1.6;
  background:#05070d;
  padding:20px;
  border-radius:12px;
  margin-top:15px;
  white-space:pre-wrap;
  word-break:break-word;
}
</style>
</head>

<body>

<div class="container">

  <!-- NEXA BRANDING -->
  <div class="header">
    <div class="logo">🌍 NEXA</div>

    <div class="tagline">
      दुनिया को जानो, हर जानकारी को Verify करो।
    </div>
  </div>

  <div class="quote">
    “कुछ जगहें सिर्फ देखने के लिए नहीं… खोजने के लिए होती हैं।”
  </div>


  <!-- ONE TIME MESSAGE -->
  <div class="box" id="oneTimeBox">

    <h2>🔐 One-Time Message</h2>

    <p>
      ऐसा message बनाओ जिसे link खोलने के बाद
      एक बार देखने पर दोबारा नहीं देखा जा सके।
    </p>

    <textarea
      id="messageInput"
      rows="5"
      placeholder="अपना message यहाँ लिखें..."
    ></textarea>

    <button onclick="createMessage()">
      🔗 One-Time Link बनाओ
    </button>

    <div id="linkResult" class="result"></div>

  </div>


  <!-- MESSAGE VIEW -->
  <div class="box" id="viewBox" style="display:none;">

    <h2>📩 One-Time Message</h2>

    <div id="messageView" class="message-view">
      Message loading...
    </div>

  </div>


  <!-- NEXA LOCATION -->
  <div class="box" id="locationBox">

    <h2>🌍 NEXA Location</h2>

    <p>
      अपना NEXA access code डालें।
    </p>

    <input
      type="text"
      id="nexaCode"
      placeholder="Enter NEXA Code"
    >

    <button onclick="unlockNexa()">
      🔓 Unlock NEXA
    </button>

    <div id="nexaResult" class="result"></div>

  </div>

</div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   SUPABASE SETTINGS
========================= */

const SUPABASE_URL =
"https://crtoxfnqfyhorcxypxem.supabase.co";

/*
  यहाँ अपनी Supabase Publishable / anon key डालो।
  Service Role / Secret key मत डालना।
*/

const SUPABASE_KEY =
"sb_publishable_8q9uqlafK4f6BctsrRLnjg_0PG3K5lu";


/*
  IMPORTANT:
  पुराने supabaseClient नाम की जगह
  unique नाम रखा गया है ताकि
  initialization error न आए।
*/

const nexasbClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   CREATE ONE-TIME MESSAGE
========================= */

async function createMessage(){

  const messageInput =
    document.getElementById("messageInput");

  const linkResult =
    document.getElementById("linkResult");

  const message =
    messageInput.value.trim();

  linkResult.style.display = "block";
  linkResult.className = "result";

  if(!message){

    linkResult.innerHTML =
      '<span class="error">❌ पहले message लिखो।</span>';

    return;
  }

  linkResult.innerHTML =
    "⏳ Link बनाया जा रहा है...";


  try{

    /* Random secure token */

    const randomBytes =
      new Uint8Array(24);

    crypto.getRandomValues(randomBytes);

    const token =
      Array.from(randomBytes)
      .map(function(b){
        return b.toString(16).padStart(2,"0");
      })
      .join("");


    /* Supabase INSERT */

    const response =
      await nexasbClient
      .from("Messages One Table")
      .insert([
        {
          Message: message,
          Token: token,
          Viewed: false
        }
      ])
      .select();


    const data = response.data;
    const error = response.error;


    if(error){

      console.error(
        "Supabase INSERT Error:",
        error
      );

      linkResult.innerHTML =
        '<span class="error">❌ Error: ' +
        error.message +
        "</span>";

      return;
    }


    /* Create URL */

    const link =
      window.location.origin +
      window.location.pathname +
      "?token=" +
      encodeURIComponent(token);


    linkResult.innerHTML = `
      <div class="success">
        ✅ One-Time Link तैयार है!
      </div>

      <br>

      <input
        id="generatedLink"
        value="${link}"
        readonly
      >

      <button onclick="copyLink()">
        📋 Link Copy करो
      </button>
    `;


    messageInput.value = "";

  }
  catch(error){

    console.error(error);

    linkResult.innerHTML =
      '<span class="error">❌ Error: ' +
      error.message +
      "</span>";
  }
}


/* =========================
   COPY LINK
========================= */

function copyLink(){

  const link =
    document.getElementById("generatedLink");

  if(!link) return;

  link.select();
  link.setSelectionRange(0,99999);


  if(
    navigator.clipboard &&
    navigator.clipboard.writeText
  ){

    navigator.clipboard
    .writeText(link.value)
    .then(function(){

      alert("✅ Link Copy हो गया!");

    })
    .catch(function(){

      alert("Link को manually copy कर लो।");

    });

  }
  else{

    document.execCommand("copy");

    alert("✅ Link Copy हो गया!");

  }
}


/* =========================
   OPEN ONE-TIME MESSAGE
========================= */

async function openOneTimeMessage(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const token =
    params.get("token");


  if(!token) return;


  /* Hide other sections */

  document.getElementById(
    "oneTimeBox"
  ).style.display = "none";

  document.getElementById(
    "locationBox"
  ).style.display = "none";

  document.getElementById(
    "viewBox"
  ).style.display = "block";


  const messageView =
    document.getElementById(
      "messageView"
    );

  messageView.innerHTML =
    "⏳ Message खुल रहा है...";


  try{

    /* Find unread message */

    const response =
      await nexasbClient
      .from("Messages One Table")
      .select("id, Message, Viewed")
      .eq("Token", token)
      .eq("Viewed", false)
      .maybeSingle();


    const data = response.data;
    const error = response.error;


    if(error){

      console.error(error);

      messageView.innerHTML =
        '<span class="error">❌ Error: ' +
        error.message +
        "</span>";

      return;
    }


    if(!data){

      messageView.innerHTML =
        '<span class="error">' +
        '❌ यह message पहले ही देखा जा चुका है या मौजूद नहीं है।' +
        '</span>';

      return;
    }


    /* Show message */

    messageView.innerText =
      data.Message;


    /*
      Mark as viewed
    */

    const updateResponse =
      await nexasbClient
      .from("Messages One Table")
      .update({
        Viewed: true
      })
      .eq("id", data.id);


    if(updateResponse.error){

      console.error(
        "Update Error:",
        updateResponse.error
      );

    }

  }
  catch(error){

    console.error(error);

    messageView.innerHTML =
      '<span class="error">❌ Error: ' +
      error.message +
      "</span>";
  }
}


/* =========================
   NEXA LOCATION
========================= */

function unlockNexa(){

  const code =
    document
    .getElementById("nexaCode")
    .value
    .trim();


  const result =
    document.getElementById(
      "nexaResult"
    );


  result.style.display = "block";
  result.className = "result";


  if(code === "NEXA583"){

    result.innerHTML = `

      <div class="success">

        <h3>🌍 NEXA Unlocked</h3>

        <p>
          📍 Bengaluru, Karnataka
        </p>

        <p>
          NEXA Location system active.
        </p>

      </div>

    `;

  }
  else{

    result.innerHTML =
      '<span class="error">' +
      '❌ गलत NEXA Code' +
      '</span>';

  }
}


/* =========================
   START
========================= */

openOneTimeMessage();

</script>

</body>
</html>
