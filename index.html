<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA Location</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f3f4;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.box {
  width: 100%;
  max-width: 420px;
  background: white;
  padding: 25px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 5px 20px rgba(0,0,0,0.15);
}

h1 {
  margin-bottom: 10px;
}

input {
  width: 100%;
  padding: 15px;
  margin: 12px 0;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 18px;
  text-align: center;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 10px;
  background: #1a73e8;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

#result {
  margin-top: 20px;
  display: none;
}

.photo {
  width: 100%;
  border-radius: 12px;
  margin-bottom: 15px;
}
</style>
</head>

<body>

<div class="box">

  <h1>📍 NEXA Location</h1>

  <p>अपना Location Code डालें</p>

  <input
    id="code"
    type="text"
    placeholder="NEXA-001"
    autocomplete="off"
  >

  <button onclick="openLocation()">
    🗺️ Open Location
  </button>

  <div id="result"></div>

</div>

<script>

const locations = {

  "NEXA-001": {
    name: "Taj Mahal, Agra",
    lat: 27.1751,
    lon: 78.0421,
    image: "https://commons.wikimedia.org/wiki/Special:Redirect/file/Taj-Mahal_CC0.jpg"
  },

  "NEXA-002": {
    name: "India Gate, New Delhi",
    lat: 28.6129,
    lon: 77.2295
  },

  "NEXA-003": {
    name: "Gateway of India, Mumbai",
    lat: 18.9220,
    lon: 72.8347
  }

};


function openLocation() {

  const code =
    document.getElementById("code").value.trim().toUpperCase();

  const result =
    document.getElementById("result");

  const location =
    locations[code];


  if (!code) {

    result.style.display = "block";

    result.innerHTML =
      "⚠️ पहले Location Code डालें।";

    return;
  }


  if (!location) {

    result.style.display = "block";

    result.innerHTML =
      "❌ यह NEXA Code मौजूद नहीं है।";

    return;
  }


  const mapsURL =
    "https://www.google.com/maps/search/?api=1&query=" +
    location.lat + "," + location.lon;


  result.style.display = "block";


  let photo = "";

  if (location.image) {

    photo =
      '<img class="photo" src="' +
      location.image +
      '" alt="' +
      location.name +
      '">';

  }


  result.innerHTML =
    photo +
    "<h2>📍 " +
    location.name +
    "</h2>" +
    '<button onclick="window.open(\'' +
    mapsURL +
    "', '_blank')\">" +
    "🗺️ Open in Google Maps" +
    "</button>";

}

</script>

</body>
</html>
